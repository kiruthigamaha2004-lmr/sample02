<!DOCTYPE html>
<html>
<head>
    <title>Greeting Application</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
            background-color: #f2f2f2;
        }

        .box {
            background: white;
            width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
        }

        input {
            padding: 10px;
            width: 250px;
        }

        button {
            padding: 10px 20px;
            margin-top: 15px;
        }

        h2 {
            color: green;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>Greeting Application</h1>

    <form method="POST">

        <label>Enter Your Name:</label><br><br>

        <input type="text" name="name" required>

        <br>

        <button type="submit">Greet Me</button>

    </form>

    {% if message %}
        <h2>{{ message }}</h2>
    {% endif %}

</div>

</body>
</html>
